# fly.toml app configuration file generated for quitbuddy on 2026-08-24T10:51:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quitbuddy'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'quitbuddy_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
